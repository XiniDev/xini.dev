<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#f2ede3">
<style>
  html,body{margin:0;background:#f2ede3}
  .cover{position:fixed;inset:0;z-index:50;background:#f2ede3;overflow:hidden;transition:opacity .2s steps(2)}
  .cover i{position:absolute;left:50%;top:50%;width:2px;height:0;background:#0b0a0d;transform:translate(-50%,-50%) rotate(14deg);animation:cut .5s steps(5) .1s forwards}
  .cover b{position:absolute;inset:0;background:#e8322b;clip-path:polygon(0 0,0 0,0 100%,0 100%);animation:wipe .6s steps(6) .55s forwards}
  @keyframes cut{to{height:140vh}}
  @keyframes wipe{to{clip-path:polygon(0 0,46% 0,40% 100%,0 100%)}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover i,.cover b{animation:none}}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"><b></b><i></i></div>
<canvas class="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
