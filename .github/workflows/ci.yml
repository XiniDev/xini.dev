name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - name: Lighthouse (informational on GPU-less runners)
        run: npm run lhci
        continue-on-error: true
        timeout-minutes: 10
