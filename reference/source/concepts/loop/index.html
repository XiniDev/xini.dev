<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#08091a">
<style>
  html,body{margin:0;background:#05061a}
  .cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#05061a;transition:opacity .35s steps(3)}
  .cover svg{width:min(26vmin,200px);height:auto;overflow:visible}
  .cover path{fill:none;stroke:#3dff8f;stroke-width:3;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.2s steps(12) .15s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"><svg viewBox="-92 -94 184 188"><path d="M-78,81 L-78,-81 L78,81 L78,-81 Z"/></svg></div>
<canvas class="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
