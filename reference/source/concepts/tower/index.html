<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#0b0708">
<style>
  html,body{margin:0;background:#070405}
  .cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#070405;transition:opacity .3s steps(3)}
  .cover svg{width:min(24vmin,180px);height:auto;overflow:visible}
  .cover .b{fill:#f3efe6;opacity:0;animation:on .01s steps(1) .5s forwards}
  .cover .f{fill:#ff2a3a;opacity:0;animation:on .01s steps(1) .9s forwards}
  .cover .r{fill:none;stroke:#ff2a3a;stroke-width:2;stroke-dasharray:480;stroke-dashoffset:480;animation:draw .9s steps(9) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes on{to{opacity:1}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover *{animation:none!important;opacity:1;stroke-dashoffset:0}}
</style>
</head>
