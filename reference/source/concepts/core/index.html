<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#05100d">
<style>
  html,body{margin:0;background:#05100d}
  .cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#05100d;transition:opacity .3s steps(3)}
  .cover svg{width:min(30vmin,220px);height:auto;overflow:visible}
  .cover circle{fill:none;stroke:#c9a25a;stroke-width:1.2;stroke-dasharray:280;stroke-dashoffset:280;animation:draw 1.1s steps(11) .1s forwards}
  .cover path{fill:none;stroke:#4cd6a6;stroke-width:2.4;stroke-dasharray:240;stroke-dashoffset:240;animation:draw .8s steps(8) .7s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover circle,.cover path{animation:none;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="44"/><path d="M36,31.2L84,88.8L84,31.2L36,88.8Z"/></svg></div>
<canvas class="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
