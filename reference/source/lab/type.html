<!doctype html><html><head><meta charset="utf-8"><title>type</title>
<style>
body{margin:0;background:#0d0f1f;color:#eee6d3;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:18px}

<script type="module">
import '@fontsource-variable/big-shoulders-display';

import '@fontsource/instrument-serif';

const S = [
 ['Big Shoulders 800 + Hanken', "'Big Shoulders Display Variable'", 800, "'Hanken Grotesk Variable'", 0],
 ['Instrument Serif + Instrument Sans', "'Instrument Serif'", 400, "'Instrument Sans Variable'", 1],
 ['Bricolage 96/75 800 + Bricolage', "'Bricolage Grotesque Variable'", 800, "'Bricolage Grotesque Variable'", 0, "'opsz' 96, 'wdth' 75"],
 ['Syne 800 + Onest', "'Syne Variable'", 800, "'Onest Variable'", 0],
 ['Unbounded 700 + Hanken', "'Unbounded Variable'", 700, "'Hanken Grotesk Variable'", 0],
 ['Familjen 700 + Familjen', "'Familjen Grotesk Variable'", 700, "'Familjen Grotesk Variable'", 0],
 ['Sofia Sans XCond 800 + Schibsted', "'Sofia Sans Extra Condensed Variable'", 850, "'Schibsted Grotesk Variable'", 0],
 ['Dela Gothic One + Zen Kaku', "'Dela Gothic One'", 400, "'Zen Kaku Gothic New'", 0],
 ['Fraunces 9pt Soft + Hanken', "'Fraunces Variable'", 650, "'Hanken Grotesk Variable'", 1, "'SOFT' 100, 'WONK' 1, 'opsz' 144"],

];
for (const [name, disp, w, body, light, fvs] of S) {
  for (const l of [0, 1]) {
  const d = document.createElement('div'); d.className = 's' + (l ? ' l' : '');
  d.innerHTML = `<div class=n>${name}</div><div class=k style="font-family:${body}">Xini · Systems engineer <span class=jp style="font-family:'Zen Kaku Gothic New'">システム</span></div>

  <p style="font-family:${body}">I take ambitious ideas all the way to production on my own: real-time 3D, multiplayer backends, data, infrastructure and the interface people actually use.</p>`;
  document.body.appendChild(d);
  }
