<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#0c0e1d">
<style>
  /* first paint: the entrance cover, before any script */
  html,body{margin:0;background:#0c0e1d}
  .cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0c0e1d;transition:opacity .25s steps(3)}
  .cover i{width:min(22vmin,160px);aspect-ratio:1;background:#eee6d3;transform:rotate(-8deg) scale(.2);animation:sheet .9s steps(6) .1s forwards;box-shadow:6px 6px 0 #07060d}
  .cover b{position:absolute;width:min(22vmin,160px);aspect-ratio:1;border:2px dashed #eee6d3;opacity:0;animation:crease 1.2s steps(4) .7s infinite}
  @keyframes sheet{60%{transform:rotate(4deg) scale(1.08)}100%{transform:rotate(-3deg) scale(1)}}
  @keyframes crease{0%{opacity:0;transform:rotate(45deg) scale(.4)}50%{opacity:.6}100%{opacity:0;transform:rotate(45deg) scale(1.2)}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover i,.cover b{animation:none;transform:none}}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"><i></i><b></b></div>
<canvas class="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
