<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xini, systems engineer</title>
<meta name="description" content="Xini builds complete, self-hosted products with modern AI woven in, across games, tools and client work.">
<meta name="theme-color" content="#0e1426">
<style>
  html,body{margin:0;background:#0b1020}
  .cover{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#0b1020;transition:opacity .4s steps(4)}
  .cover svg{width:min(26vmin,190px);height:auto;overflow:visible}
  .cover circle{fill:none;stroke:#c9a45c;stroke-width:1.4;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 1.2s steps(12) forwards}
  .cover circle.b{animation-delay:.2s} .cover circle.c{animation-delay:.4s}
  .cover path{fill:#5ac8e6;opacity:0;animation:on .01s steps(1) 1.1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes on{to{opacity:1}}
  html.ready .cover{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion: reduce){.cover *{animation:none!important;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="cover" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56"/><circle class="b" cx="60" cy="60" r="44" transform="rotate(60 60 60) scale(1 0.5) translate(0 60)"/><circle class="c" cx="60" cy="60" r="44" transform="rotate(-30 60 60)"/><path transform="translate(42 42) scale(0.3)" d="M43.98,58.66 L58.71,43.36 L31.08,14.67 L31.08,45.27 Z M8.00,98.70 L29.22,107.26 L112.00,21.30 L90.78,12.74 Z M88.92,74.73 L76.02,61.34 L61.29,76.64 L88.92,105.33 Z M8.00,96.02 L29.22,73.98 L29.22,12.74 L8.00,21.30 Z M112.00,23.98 L90.78,46.02 L90.78,107.26 L112.00,98.70 Z"/></svg></div>
<canvas class="gl" aria-hidden="true"></canvas>
<div id="app"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
