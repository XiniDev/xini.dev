<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#05100d;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { InkPipeline, post } from '../shared/gfx/pipeline.js';
import { makeBackdrop, backdrop } from '../shared/gfx/backdrop.js';
import { shared } from '../shared/gfx/ink-material.js';
import { paintMaterial, crystalMaterial, paintShared } from '../shared/gfx/paint-material.js';
import { ringGeometry, crystalGeometry, finialGeometry, runeStrip, GLYPH_NAMES } from '../concepts/core/parts.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer(); r.autoClear = false; document.body.appendChild(r.domElement);
const pipe = new InkPipeline(r, { glow: false, kuwahara: +(q.get('k') ?? 0) });
const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); cam.position.set(0, 0.3, 9); cam.lookAt(0, 0, 0);
const bg = makeBackdrop(shared.uPx); scene.add(bg);
backdrop.uTop.value.set('#071713'); backdrop.uBottom.value.set('#0f2a22'); backdrop.uGlowCol.value.set('#1d6b52'); backdrop.uGlowAmt.value = 0.5; backdrop.uGlowPos.value.set(0.5, 0.52); backdrop.uDot.value.set('#030806'); backdrop.uDotAmt.value = 0.35;
const brass = '#c9a25a';
const rings = [];
const radii = [1.0, 1.2, 1.4, 1.6, 1.8];
radii.forEach((R, i) => {
  const seq = GLYPH_NAMES.slice(i).concat(GLYPH_NAMES.slice(0, i));
  const tex = runeStrip(seq, { slots: 10 + i * 2 });
  const m = new THREE.Mesh(ringGeometry(R, 0.15, 0.045), paintMaterial({ base: brass, runes: tex, tangent: true, face: true, charge: q.has('c') ? 0.7 : 0, hatch: 0.6 }));
  m.rotation.set([1.3, 0.5, -0.4, 0.9, 0.2][i], [0, 0.7, 1.4, -0.6, 0.3][i], [0.2, -0.3, 0.6, 0.1, -0.8][i]);
  scene.add(m); rings.push(m);
});
const crystal = new THREE.Mesh(crystalGeometry(), crystalMaterial()); scene.add(crystal);
const f1 = new THREE.Mesh(finialGeometry(1.1), paintMaterial({ base: brass })); f1.position.y = 1.95; scene.add(f1);
const f2 = new THREE.Mesh(finialGeometry(1.1), paintMaterial({ base: brass })); f2.position.y = -1.95; f2.rotation.x = Math.PI; scene.add(f2);
const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 3.9, 12), paintMaterial({ base: '#8a6a35' })); scene.add(axle);
post.uInk.value.set('#05100d'); post.uLineAlpha.value = +(q.get('la') ?? 0.65); post.uGradeShadow.value.set('#04110d'); post.uGradeAmt.value = 0.2; post.uMisregPx.value = 0.8; post.uGrain.value = 0.035; post.uVignette.value = 0.45;
paintShared.uKeyDir.value.set(-0.55, 0.62, 0.55).normalize();
function resize(){ r.setSize(innerWidth, innerHeight); pipe.setSize(innerWidth, innerHeight, 1); bg.material.uniforms.uRes.value.set(innerWidth, innerHeight); }
resize();
function f(t){ pipe.render(scene, cam); requestAnimationFrame(f); } f();
window.__xini = { ready: true };
</script></body></html>
